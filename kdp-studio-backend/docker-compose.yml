services:
  postgres:
    image: postgres:16-alpine
    container_name: kdp_studio_postgres
    environment:
      POSTGRES_USER: kdp_user
      POSTGRES_PASSWORD: kdp_password
      POSTGRES_DB: kdp_studio
    ports:
      - "5432:5432"
    volumes:
      - kdp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdp_user -d kdp_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kdp_studio_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: python:3.11-slim
    container_name: kdp_studio_api
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://kdp_user:kdp_password@postgres:5432/kdp_studio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: python:3.11-slim
    container_name: kdp_studio_worker
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://kdp_user:kdp_password@postgres:5432/kdp_studio
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: sh -c "pip install -r requirements.txt && celery -A app.workers.celery_app worker --loglevel=info"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kdp_pg_data:
